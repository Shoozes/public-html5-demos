    const makeShip=(style='player')=>{const root=new THREE.Group();const colors={player:[0x9eece5,0x1a8e9f],hostile:[0xd74368,0x6e1439],neutral:[0xd0ad68,0x6c5528]}[style];addMesh(root,geom('hull',()=>new THREE.BoxGeometry(1.7,.7,3.5)),mat(`${style}-hull`,colors[0],colors[1]),[0,.55,0],[0,0,0],[1,1,1]);addMesh(root,geom('nose',()=>new THREE.ConeGeometry(.82,1.8,5)),mat(`${style}-accent`,colors[1],colors[1]),[0,.54,-2.45],[-Math.PI/2,0,0]);addMesh(root,geom('wing',()=>new THREE.BoxGeometry(3.9,.2,1.5)),mat(`${style}-dark`,style==='hostile'?0x391326:0x17323e,colors[1]),[0,.42,.35],[0,0,0]);addMesh(root,geom('canopy',()=>new THREE.SphereGeometry(.65,12,8)),mat(`${style}-glass`,style==='hostile'?0xff7994:0x64d9ff,colors[1]),[0,1,-.35],[0,0,0],[.72,.55,1]);const pivot=new THREE.Group();pivot.position.set(0,1.05,-.25);addMesh(pivot,geom('barrel',()=>new THREE.BoxGeometry(.18,.18,2.2)),mat(`${style}-weapon`,0xb9e6eb,colors[1]),[0,0,-1.05]);root.add(pivot);root.userData.weaponPivot=pivot;addMesh(root,geom('engine',()=>new THREE.CylinderGeometry(.18,.28,.6,10)),mat(`${style}-engine`,0x9cfef1,colors[1]),[-.55,.52,2],[Math.PI/2,0,0]);addMesh(root,geom('engine',()=>new THREE.CylinderGeometry(.18,.28,.6,10)),mat(`${style}-engine`,0x9cfef1,colors[1]),[.55,.52,2],[Math.PI/2,0,0]);return root};
    const makeStation=()=>{const root=new THREE.Group();addMesh(root,geom('station-core',()=>new THREE.CylinderGeometry(2.3,3,2.5,8)),mat('station-core',0x728394,0x17385e),[0,1.1,0]);addMesh(root,geom('station-ring',()=>new THREE.TorusGeometry(4.1,.38,8,28)),mat('station-ring',0x8b9cab,0x36b7a9,true),[0,1.2,0],[Math.PI/2,0,0]);for(let i=0;i<4;i++){const a=i*Math.PI/2;addMesh(root,geom('station-arm',()=>new THREE.BoxGeometry(.55,.4,3)),mat('station-dark',0x263445,0x17385e),[Math.sin(a)*3,1.15,Math.cos(a)*3],[0,a,0])}return root};
    const makeLandmark=(kind)=>{const root=new THREE.Group();if(kind==='beacon'){addMesh(root,geom('beacon-pole',()=>new THREE.CylinderGeometry(.22,.5,5,8)),mat('beacon-metal',0x6b7a88,0x17385e),[0,2,0]);addMesh(root,geom('beacon-light',()=>new THREE.OctahedronGeometry(.8)),mat('beacon-light',0x96fff0,0x48d6c3,true),[0,4.8,0])}else{addMesh(root,geom('wreck-body',()=>new THREE.BoxGeometry(2,.8,5)),mat('wreck',0x3c4550,0x241b2a),[0,.4,0],[.12,.3,.38]);addMesh(root,geom('wreck-wing',()=>new THREE.BoxGeometry(5,.2,1.3)),mat('wreck-dark',0x252a35,0x241b2a),[-.8,.25,.4],[0,.25,-.15])}return root};

    const buildBackdrop=()=>{const starsGeom=new THREE.BufferGeometry(),points=[];let seed=981723;const rand=()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296);for(let i=0;i<900;i++)points.push((rand()-.5)*180,4+rand()*55,(rand()-.5)*180);starsGeom.setAttribute('position',new THREE.Float32BufferAttribute(points,3));const stars=new THREE.Points(starsGeom,new THREE.PointsMaterial({color:0xb5d9ff,size:.18,sizeAttenuation:true,transparent:true,opacity:.82}));scene.add(stars);shared.roots.push(stars);const grid=new THREE.GridHelper(130,26,0x174352,0x101b30);grid.position.y=-.08;grid.material.transparent=true;grid.material.opacity=.18;scene.add(grid);shared.roots.push(grid);scene.add(new THREE.HemisphereLight(0x9bcfff,0x080513,1.45));const sun=new THREE.DirectionalLight(0xfff2da,3.2);sun.position.set(-18,32,14);sun.castShadow=true;scene.add(sun);shared.roots.push(sun)};
    const spawnProjectile=(owner,target)=>{if(world.elapsed<world.safeUntil&&owner.faction==='hostile')return;const dir=target.pos.clone().sub(owner.pos).setY(0).normalize();const root=new THREE.Group();const mesh=addMesh(root,geom('bolt',()=>new THREE.CapsuleGeometry(.11,.8,4,6)),mat(owner.faction==='hostile'?'bolt-hostile':'bolt-player',owner.faction==='hostile'?0xff5279:0x7dfff0,owner.faction==='hostile'?0xff184f:0x28daca),[0,0,0],[Math.PI/2,0,0]);mesh.userData.ownedMaterial=false;root.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);const shot=queue({kind:'projectile',name:'Projectile',faction:owner.faction,ownerId:owner.id,pos:owner.pos.clone().add(new THREE.Vector3(0,1,0)).addScaledVector(dir,2.4),vel:dir.multiplyScalar(28),radius:.2,life:2.1,rangeLeft:55,damage:owner.faction==='player'?22:7,prev:new THREE.Vector3()},root);shot.prev.copy(shot.pos);world.stats.shots[owner.faction]++};

    const teardownWorld=()=>{clearInput();for(const id of [...world.entities.keys()])scheduleDestroy(id);flushDestroy();world.spawn.length=0;world.playerId=null};

    const updateHud=()=>{const player=live(world.playerId);ui.hull.textContent=player?Math.ceil(player.hp):'0';ui.hullBar.style.width=`${player?player.hp/player.maxHp*100:0}%`;ui.credits.textContent=`${player?.credits||0} cr`;const selected=live(world.selectedId),target=live(world.targetId),display=selected||target;if(!display){ui.contact.style.display='none';return}ui.contact.style.display='block';ui.contactName.textContent=display.name;ui.contactMeta.textContent=`${display.faction} / ${display.category||display.kind}${display.hp!=null?` / hull ${Math.ceil(display.hp)}`:''}`;ui.targetLine.hidden=!target;ui.targetLine.textContent=target?`Combat lock: ${target.name}`:'';ui.disengage.hidden=!target;const playerDistance=player?player.pos.distanceTo(display.pos):Infinity;const canAct=display.action&&playerDistance<10;ui.interact.hidden=!canAct;ui.interact.textContent=canAct?display.action:''};
    const acquireTarget=player=>{const current=live(world.targetId);if(current&&current.faction==='hostile'&&current.aggressive&&player.pos.distanceTo(current.pos)<=29)return current;if(current)setTarget(null);let best=null,bestD=22;for(const h of world.entities.values()){if(!h.active||h.faction!=='hostile'||!h.aggressive)continue;const suppressed=world.suppress.get(h.id);const d=player.pos.distanceTo(h.pos);if(suppressed){if(suppressed.requiresExit&&d>22)world.suppress.delete(h.id);else if(world.elapsed<suppressed.until||suppressed.requiresExit)continue}if(d<bestD){best=h;bestD=d}}if(best){setTarget(best.id);emit('combat',`Automatic lock: ${best.name}`)}return best};
    const segmentHit=(a,b,c,r)=>{const ab=b.clone().sub(a),ac=c.clone().sub(a);const t=Math.max(0,Math.min(1,ac.dot(ab)/(ab.lengthSq()||1)));return a.clone().addScaledVector(ab,t).distanceToSquared(c)<=r*r};
    const updatePlayer=(p,dt)=>{let x=0,z=0;if(world.keys.has('KeyA')||world.keys.has('ArrowLeft'))x--;if(world.keys.has('KeyD')||world.keys.has('ArrowRight'))x++;if(world.keys.has('KeyW')||world.keys.has('ArrowUp'))z--;if(world.keys.has('KeyS')||world.keys.has('ArrowDown'))z++;x+=world.joystick.x;z+=world.joystick.y;const len=Math.hypot(x,z);if(len>.05){x/=Math.max(1,len);z/=Math.max(1,len);p.pos.x+=x*8.2*dt;p.pos.z+=z*8.2*dt;p.facing=Math.atan2(x,-z);p.render.rotation.y=p.facing;world.playerMoved=true}p.pos.x=THREE.MathUtils.clamp(p.pos.x,-58,58);p.pos.z=THREE.MathUtils.clamp(p.pos.z,-58,58);const target=acquireTarget(p);p.cooldown-=dt;if(target){const dx=target.pos.x-p.pos.x,dz=target.pos.z-p.pos.z;const aim=Math.atan2(dx,-dz);p.render.userData.weaponPivot.rotation.y=aim-p.facing;if(p.pos.distanceTo(target.pos)<24&&p.cooldown<=0){spawnProjectile(p,target);p.cooldown=.44}}else p.render.userData.weaponPivot.rotation.y=THREE.MathUtils.lerp(p.render.userData.weaponPivot.rotation.y,0,.12)};
    const updateShip=(s,dt)=>{if(s.faction==='neutral'){s.roam+=dt;s.facing+=Math.sin(s.roam*.6)*dt*.1;s.pos.x+=Math.sin(s.facing)*dt*1.1;s.pos.z-=Math.cos(s.facing)*dt*1.1;s.render.rotation.y=s.facing;return}const player=live(world.playerId);if(!player)return;const d=player.pos.distanceTo(s.pos);if(!s.aggressive&&((world.elapsed>=world.safeUntil&&d<18.5)||(s.provoked&&d<27))){s.aggressive=true;emit('threat',`${s.name} has gone weapons-hot`)}if(!s.aggressive){s.patrolPhase+=dt;s.facing+=Math.sin(s.patrolPhase)*dt*.18;s.pos.x+=Math.sin(s.facing)*dt*.45;s.pos.z-=Math.cos(s.facing)*dt*.45;s.render.rotation.y=s.facing;return}const dx=player.pos.x-s.pos.x,dz=player.pos.z-s.pos.z,aim=Math.atan2(dx,-dz);if(d>10){s.pos.x+=dx/d*dt*2.25;s.pos.z+=dz/d*dt*2.25}else{s.pos.x+=Math.cos(aim)*dt*1.25;s.pos.z+=Math.sin(aim)*dt*1.25}s.facing=THREE.MathUtils.lerp(s.facing,aim,.06);s.render.rotation.y=s.facing;s.render.userData.weaponPivot.rotation.y=aim-s.facing;s.cooldown-=dt;if(d<21&&s.cooldown<=0){spawnProjectile(s,player);s.cooldown=1.15+(s.id%3)*.16}};
    const updateProjectile=(p,dt)=>{p.prev.copy(p.pos);const travel=p.vel.length()*dt;p.pos.addScaledVector(p.vel,dt);p.life-=dt;p.rangeLeft-=travel;if(p.life<=0||p.rangeLeft<=0){scheduleDestroy(p.id);return}for(const target of world.entities.values()){if(!target.active||target.id===p.ownerId||target.faction===p.faction||!['player','ship'].includes(target.kind))continue;if(segmentHit(p.prev,p.pos,target.pos.clone().setY(.7),target.radius+p.radius)){damage(target,p.damage,live(p.ownerId));scheduleDestroy(p.id);break}}};
    const updatePickup=(p,dt)=>{const player=live(world.playerId);if(!player)return;p.age+=dt;p.vel.multiplyScalar(Math.exp(-1.5*dt));p.pos.addScaledVector(p.vel,dt);const d=player.pos.distanceTo(p.pos);if(p.age>.8&&d<11){const toward=player.pos.clone().add(new THREE.Vector3(0,.6,0)).sub(p.pos);p.vel.addScaledVector(toward,dt*(4.5+Math.max(0,11-d)*.9));p.vel.multiplyScalar(Math.exp(-2.2*dt));p.render.scale.setScalar(1+Math.sin(world.elapsed*9+p.id)*.12)}if(d<1.7){player.credits+=p.value;world.stats.pickups++;world.stats.creditsAwarded+=p.value;scheduleDestroy(p.id);emit('salvage',`Recovered ${p.value} credits`);ui.flash.style.opacity='1';setTimeout(()=>ui.flash.style.opacity='0',40)}};
    const update=(dt)=>{const player=live(world.playerId);for(const e of [...world.entities.values()]){if(!e.active||e.pendingDestroy)continue;if(e.kind==='player')updatePlayer(e,dt);else if(e.kind==='ship')updateShip(e,dt);else if(e.kind==='projectile')updateProjectile(e,dt);else if(e.kind==='pickup')updatePickup(e,dt);else if(e.kind==='debris')e.render.rotation.y+=e.spin*dt;if(e.render)e.render.position.copy(e.pos)}flushSpawns();flushDestroy();if(player){const desired=player.pos.clone().add(new THREE.Vector3(0,35,27));camera.position.lerp(desired,1-Math.exp(-8*dt));camera.lookAt(player.pos.x,0,player.pos.z);for(const [id,s] of [...world.suppress])if(!live(id)||world.elapsed>s.until+20)world.suppress.delete(id)}updateHud()};
    const render=()=>renderer.render(scene,camera);
    const resize=()=>{const aspect=innerWidth/Math.max(1,innerHeight);camera.top=cameraSpan/2;camera.bottom=-cameraSpan/2;camera.left=-cameraSpan*aspect/2;camera.right=cameraSpan*aspect/2;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight)};
    const invariants=()=>{const errors=[];if(world.selectedId!=null&&!live(world.selectedId))errors.push('selected ID is not live');if(world.targetId!=null&&!live(world.targetId))errors.push('target ID is not live');for(const id of world.destroy){const e=world.entities.get(id);if(e?.active)errors.push(`pending-destroy ${id} remains active`)}for(const [id,root] of world.renders){if(!world.entities.has(id))errors.push(`render ${id} has no entity`);if(!root.parent)errors.push(`render ${id} is detached`)}for(const e of world.entities.values())if(e.render&&world.renders.get(e.id)!==e.render)errors.push(`entity ${e.id} representation mismatch`);const roots=[...world.renders.values()];if(new Set(roots).size!==roots.length)errors.push('duplicate entity representation');if(world.loopCount!==1)errors.push(`${world.loopCount} animation loops active`);return{pass:errors.length===0,errors,loopCount:world.loopCount,entities:world.entities.size,renders:world.renders.size,selectedId:world.selectedId,targetId:world.targetId}};
    const snapshot=()=>{const player=live(world.playerId);return{ready:true,backend:world.backend,elapsed:+world.elapsed.toFixed(3),safeUntil:+world.safeUntil.toFixed(3),restartCount:world.restartCount,player:player?{id:player.id,pos:[+player.pos.x.toFixed(3),+player.pos.y.toFixed(3),+player.pos.z.toFixed(3)],facing:+player.facing.toFixed(3),weaponFacing:+(player.facing+player.render.userData.weaponPivot.rotation.y).toFixed(3),hp:player.hp,credits:player.credits}:null,selectedId:world.selectedId,targetId:world.targetId,events:world.events.map(e=>e.text),stats:structuredClone(world.stats),entities:[...world.entities.values()].filter(e=>e.active).map(e=>({id:e.id,name:e.name,kind:e.kind,faction:e.faction,category:e.category,pos:[+e.pos.x.toFixed(2),+e.pos.y.toFixed(2),+e.pos.z.toFixed(2)],hp:e.hp,aggressive:e.aggressive,pendingDestroy:e.pendingDestroy})),invariants:invariants()}};
    const byName=name=>[...world.entities.values()].find(e=>e.active&&e.name===name);
    const readyResolve={};readyResolve.promise=new Promise(resolve=>readyResolve.resolve=resolve);
    window.__haio={ready:readyResolve.promise,snapshot,invariants,clearInput,restart,disengage,selectByName:name=>setSelection(byName(name)?.id),forceAggro:name=>{const h=byName(name);if(h?.faction==='hostile'){h.provoked=true;h.aggressive=true;emit('threat',`${h.name} provoked for diagnostics`);return h.id}return null},moveNear:(name,distance=9)=>{const p=live(world.playerId),e=byName(name);if(p&&e){e.pos.copy(p.pos).add(new THREE.Vector3(distance,0,0));e.render.position.copy(e.pos);return e.id}return null},destroyHostile:name=>{const h=byName(name);if(h?.faction==='hostile'){damage(h,999,live(world.playerId));flushSpawns();flushDestroy();return true}return false},spawnPickupNearPlayer:(distance=6)=>{const p=live(world.playerId);if(!p)return null;const q=queue({kind:'pickup',name:'Salvage shard',faction:'neutral',pos:p.pos.clone().add(new THREE.Vector3(distance,.65,0)),vel:new THREE.Vector3(),radius:.6,age:1,value:5},makePickup());flushSpawns();return q.id},interact:()=>ui.interact.click(),setPlayerPosition:(x,z)=>{const p=live(world.playerId);if(p){p.pos.set(x,0,z);p.render.position.copy(p.pos)}},worldToScreen:name=>{const e=byName(name);if(!e)return null;const v=e.pos.clone().add(new THREE.Vector3(0,1,0)).project(camera);return{x:(v.x+1)*innerWidth/2,y:(1-v.y)*innerHeight/2}},version:'round-4.1'};
    document.addEventListener('keydown',event=>{if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.code)){event.preventDefault();world.keys.add(event.code)}});document.addEventListener('keyup',event=>world.keys.delete(event.code));window.addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput()});
    let joyPointer=null;const joyUpdate=event=>{const r=ui.joystick.getBoundingClientRect(),dx=event.clientX-(r.left+r.width/2),dy=event.clientY-(r.top+r.height/2),limit=r.width*.31,len=Math.hypot(dx,dy)||1,scale=Math.min(1,limit/len),px=dx*scale,py=dy*scale;ui.stick.style.transform=`translate(${px}px,${py}px)`;world.joystick.set(px/limit,py/limit)};ui.joystick.addEventListener('pointerdown',event=>{joyPointer=event.pointerId;ui.joystick.setPointerCapture(joyPointer);joyUpdate(event)});ui.joystick.addEventListener('pointermove',event=>{if(event.pointerId===joyPointer)joyUpdate(event)});const joyEnd=event=>{if(event.pointerId===joyPointer){joyPointer=null;world.joystick.set(0,0);ui.stick.style.transform='translate(0px,0px)'}};ui.joystick.addEventListener('pointerup',joyEnd);ui.joystick.addEventListener('pointercancel',joyEnd);ui.joystick.addEventListener('lostpointercapture',()=>{joyPointer=null;world.joystick.set(0,0)});
    let tapStart=null;ui.canvas.addEventListener('pointerdown',event=>tapStart={x:event.clientX,y:event.clientY});ui.canvas.addEventListener('pointerup',event=>{if(!tapStart||Math.hypot(event.clientX-tapStart.x,event.clientY-tapStart.y)>8)return;pointer.x=event.clientX/innerWidth*2-1;pointer.y=-(event.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects([...world.renders.values()],true).find(h=>live(h.object.userData.entityId));if(!hit){setSelection(null);return}const id=hit.object.userData.entityId;if(id===world.targetId)disengage();else setSelection(id)});
    ui.disengage.addEventListener('click',disengage);ui.interact.addEventListener('click',()=>{const e=live(world.selectedId)||live(world.targetId),p=live(world.playerId);if(e?.action&&p&&p.pos.distanceTo(e.pos)<10)emit('interaction',e.category==='station'?'Lattice Haven grants local traffic data':`${e.name}: archive fragment recovered`)});document.querySelector('#restart').addEventListener('click',restart);document.querySelector('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(error){emit('system','Fullscreen request was declined')}});window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);
    buildBackdrop();createWorld();resize();stage='first-update';update(0);stage='render';render();world.firstFrameAt=performance.now();world.safeUntil=world.elapsed+3.2;readyResolve.resolve();stage='running';world.loopCount=1;renderer.setAnimationLoop(()=>{try{const dt=Math.min(clock.getDelta(),.05);world.elapsed+=dt;update(dt);render()}catch(error){renderer.setAnimationLoop(null);world.loopCount=0;fatal(stage,error)}});
