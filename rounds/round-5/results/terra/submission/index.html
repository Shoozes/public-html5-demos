<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Vanta Reach — Hostile Space Sector</title>
  <style>
    :root{--cyan:#28e7f5;--coral:#ff625a;--amber:#ffad38;--green:#a7ff94;--ink:#02060d;--glass:rgba(3,15,26,.72);--line:rgba(46,214,241,.31)}
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Arial,Helvetica,sans-serif;color:#d8f5fa}
    #game{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 46%,#071422 0,#02070e 53%,#010309 100%)} canvas{display:block;width:100%;height:100%}
    #hud{position:absolute;inset:0;pointer-events:none;text-transform:uppercase;letter-spacing:.055em;font-size:12px;text-shadow:0 1px 5px #000}
    .panel{position:absolute;border:1px solid var(--line);border-radius:7px;background:linear-gradient(135deg,rgba(5,25,40,.76),rgba(2,8,15,.48));box-shadow:inset 0 0 32px rgba(0,181,231,.045),0 8px 30px rgba(0,0,0,.18);padding:11px 13px;min-width:194px}
    #playerPanel{left:24px;top:28px;color:var(--cyan)} #targetPanel{right:24px;top:28px;color:var(--coral);min-width:170px} .title{font-weight:700;font-size:14px}.meter{display:flex;gap:2px;margin:10px 0 6px}.meter i{width:24px;height:12px;background:currentColor;opacity:.9;box-shadow:0 0 8px currentColor}.stat{color:#e5f8fb;font-size:13px}.credit{margin-top:10px;color:var(--cyan)}.credit b{display:block;font-size:18px;margin-top:3px}
    #events{position:absolute;left:270px;bottom:38px;color:#ffd16f;line-height:1.9;font-size:13px;max-width:300px}.event.green{color:var(--green)}.event:before{content:'› ';font-weight:bold}
    .dial{position:absolute;bottom:28px;width:228px;height:228px;border:1px solid rgba(40,231,245,.72);border-radius:50%;box-shadow:inset 0 0 36px rgba(24,192,240,.07),0 0 22px rgba(0,118,180,.12);background:radial-gradient(circle,rgba(20,79,105,.22) 0 13%,transparent 14% 32%,rgba(19,111,143,.12) 33% 33.7%,transparent 34%)}
    #joystick{left:28px;pointer-events:auto;touch-action:none} #radar{right:28px}.dial:before,.dial:after{content:'';position:absolute;left:50%;top:8%;width:1px;height:84%;background:rgba(55,214,246,.25);transform:translateX(-50%)}.dial:after{transform:translateX(-50%) rotate(90deg)}
    #stick{position:absolute;left:50%;top:50%;width:64px;height:64px;border:1px solid rgba(115,237,255,.85);border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(74,212,247,.35),rgba(18,59,83,.25));box-shadow:0 0 16px rgba(42,224,255,.22)}
    .radarMark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 8px currentColor}.radarMark.cyan{background:var(--cyan)}.radarMark.amber{background:var(--amber)}
    #controls{position:absolute;right:24px;bottom:267px;display:flex;gap:8px;pointer-events:auto}button{border:1px solid rgba(72,220,246,.42);border-radius:4px;background:rgba(5,23,38,.8);color:#c6f7fb;padding:8px 10px;font:600 11px Arial;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}button:hover{background:rgba(16,66,86,.9)}#interact{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);pointer-events:auto;color:#ffda91;border-color:rgba(255,178,56,.6)}
    .worldLabel{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:11px;font-weight:bold;line-height:1.35;white-space:nowrap;text-shadow:0 2px 5px #000}.worldLabel small{display:block;color:#d8f5fa;font-size:10px;font-weight:normal}.coral{color:var(--coral)}.amber{color:var(--amber)}.greenText{color:var(--green)}.cyanText{color:var(--cyan)}
    #error{position:absolute;z-index:10;inset:0;display:none;place-items:center;padding:30px;background:#03080f;color:#ff958d;text-align:center;font:15px ui-monospace,Consolas,monospace;white-space:pre-wrap}.hint{position:absolute;left:50%;top:calc(50% + 94px);transform:translateX(-50%);font-size:10px;color:rgba(174,238,247,.56);white-space:nowrap}
    @media(max-width:600px){#playerPanel{left:28px;top:32px;min-width:215px}#targetPanel{right:28px;top:32px;min-width:170px}.panel{padding:10px 12px}.dial{width:202px;height:202px;bottom:34px}#joystick{left:32px}#radar{right:32px}#events{left:45px;bottom:249px;font-size:11px;max-width:230px}#controls{right:28px;bottom:248px}.hint{top:calc(50% + 72px)}}
    @media(max-width:430px){#playerPanel{left:15px;top:32px;min-width:0;width:168px}#targetPanel{right:15px;top:32px;min-width:0;width:168px}.title{font-size:11px}.panel{padding:9px 10px}.meter{margin:7px 0 5px}.meter i{width:19px;height:10px}.dial{width:145px;height:145px;bottom:22px}#joystick{left:20px}#radar{right:20px}#events{left:20px;bottom:185px;font-size:10px;max-width:180px}#controls{right:18px;bottom:177px;gap:5px}button{padding:7px 8px;font-size:9px}.hint{display:none}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js"}}</script>

<body>
<main id="game" aria-label="Vanta Reach hostile space sector">
  <div id="hud">
    <section id="playerPanel" class="panel"><div class="title">◇ CorvettE · Kestrel</div><div class="meter" aria-label="Hull"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="stat"><span id="hp">100</span> / 100</div><div class="credit">Credits<b id="credits">0</b></div></section>
    <section id="targetPanel" class="panel"><div class="title" id="targetName">SECTOR CONTACTS</div><div class="meter"><i></i><i></i><i></i><i></i></div><div class="stat" id="targetState">SCAN PASSIVE</div></section>
    <div id="events"><div class="event">Vanta Reach relay online</div><div class="event green">Salvage signatures detected</div></div>
    <div id="joystick" class="dial" aria-label="Virtual movement joystick"><div id="stick"></div></div>
    <div id="radar" class="dial" aria-label="Sector radar"><span class="radarMark" style="left:28%;top:25%"></span><span class="radarMark" style="left:75%;top:30%"></span><span class="radarMark" style="left:28%;top:74%"></span><span class="radarMark cyan" style="left:64%;top:58%"></span><span class="radarMark amber" style="left:70%;top:66%"></span></div>
    <div id="controls"><button id="disengage" type="button">Disengage</button><button id="restart" type="button">Restart</button></div>
    <button id="interact" type="button" hidden>Request docking telemetry</button><div class="hint">WASD / ARROWS TO MANEUVER · THREAT LOCK IS AUTOMATIC</div>
  </div>
  <div id="error" role="alert"></div>
</main>
<script type="module">
  const errorPanel = document.querySelector('#error');
  const stageError = (stage, error) => { errorPanel.style.display = 'grid'; errorPanel.textContent = `STARTUP ${stage} FAILED\n${error?.message || error}`; };
  let THREE, TSL;
  try {
    [THREE, TSL] = await Promise.all([import('three'),import('three/tsl')]);
  } catch (error) { stageError('IMPORT', error); throw error; }

  const $ = selector => document.querySelector(selector);
  const hud = { hp:$('#hp'), credits:$('#credits'), targetName:$('#targetName'), targetState:$('#targetState'), events:$('#events'), interact:$('#interact') };
  const game = $('#game');
  const ids = { next: 1 };
  const state = { entities:new Map(), labels:new Map(), scene:null, renderer:null, camera:null, clock:null, playerId:null, targetId:null, selectedId:null, input:{x:0,z:0}, keys:new Set(), projectiles:[], events:['Vanta Reach relay online','Salvage signatures detected'], stats:{shots:{player:0,hostile:0},pickups:0,creditsAwarded:0}, restartCount:0, loopCount:0, startedAt:performance.now(), suppressedUntil:0, ready:false, disposed:false, frame:0 };
  const materials = new Map();
  const geometries = new Map();
  const constants = { cyan:0x27dbe9, cyanLite:0x73f7ff, coral:0xee5e55, coralLite:0xff8a72, steel:0x637583, warm:0xa98a53, amber:0xffa329, green:0x75d86e, dark:0x111c27 };
  const getGeo = (key, factory) => geometries.get(key) || (geometries.set(key, factory()), geometries.get(key));
  const getMat = (key, color, emissive=0x000000, intensity=0) => {
    if (materials.has(key)) return materials.get(key);
    const material = new THREE.MeshStandardNodeMaterial({ color, roughness:.58, metalness:.48, emissive, emissiveIntensity:intensity });
    material.emissiveNode = TSL.color ? TSL.color(emissive) : null;
    materials.set(key, material); return material;
  };
  const mesh = (geoKey, geoFactory, matKey, color, emissive=0, intensity=0) => new THREE.Mesh(getGeo(geoKey, geoFactory), getMat(matKey,color,emissive,intensity));
  const box = (x,y,z,mat='steel') => { const glowing=['cyan','coral','amber','green'].includes(mat); const m=mesh(`box-${x}-${y}-${z}`,()=>new THREE.BoxGeometry(x,y,z),mat, constants[mat]??constants.steel, mat==='cyan'?constants.cyan:mat==='coral'?constants.coral:mat==='amber'?constants.amber:mat==='green'?constants.green:0,glowing?.8:0); return m; };
  const addPart = (group, object, x=0,y=0,z=0,rotation=[0,0,0]) => { object.position.set(x,y,z); object.rotation.set(...rotation); group.add(object); return object; };
  const cone = (radius,depth,mat) => mesh(`cone-${radius}-${depth}`,()=>new THREE.ConeGeometry(radius,depth,5),mat,constants[mat]??constants.steel,mat==='cyan'?constants.cyan:mat==='coral'?constants.coral:mat==='amber'?constants.amber:0,mat==='cyan'||mat==='coral'||mat==='amber'?.45:0);
  const cylinder = (radius,depth,mat) => mesh(`cyl-${radius}-${depth}`,()=>new THREE.CylinderGeometry(radius,radius,depth,8),mat,constants[mat]??constants.steel,mat==='cyan'?constants.cyan:mat==='coral'?constants.coral:mat==='amber'?constants.amber:0,mat==='cyan'||mat==='coral'||mat==='amber'?.5:0);

  function playerModel(){ const g=new THREE.Group(); addPart(g, box(1.25,.38,2.4,'cyan'),0,.25,0); addPart(g, cone(.67,1.25,'cyan'),0,.29,-1.58,[Math.PI/2,0,0]); addPart(g, box(2.8,.18,1.05,'cyan'),0,.10,.18,[0,.1,0]); addPart(g, box(.4,.28,1.25,'cyan'),-1.08,.12,.38,[0,-.25,0]); addPart(g, box(.4,.28,1.25,'cyan'),1.08,.12,.38,[0,.25,0]); addPart(g, box(.58,.38,.78,'steel'),0,.58,-.05); addPart(g, cylinder(.28,.9,'steel'),-.65,.2,1.23,[Math.PI/2,0,0]); addPart(g, cylinder(.28,.9,'steel'),.65,.2,1.23,[Math.PI/2,0,0]); addPart(g, cone(.2,.58,'amber'),-.65,.2,1.85,[-Math.PI/2,0,0]); addPart(g, cone(.2,.58,'amber'),.65,.2,1.85,[-Math.PI/2,0,0]); return g; }
  function hostileModel(variant){ const g=new THREE.Group(); addPart(g,box(1,.34,2,'coral'),0,.22,0); addPart(g,cone(.56,1.1,'coral'),0,.26,-1.32,[Math.PI/2,0,0]); if(variant===0){addPart(g,box(2.3,.16,.7,'coral'),0,.08,.1);addPart(g,cone(.24,.8,'steel'),-1.12,.14,.55,[0,0,Math.PI/2]);addPart(g,cone(.24,.8,'steel'),1.12,.14,.55,[0,0,-Math.PI/2]);} if(variant===1){addPart(g,box(.46,.28,1.55,'coral'),-1.0,.13,.3,[0,-.3,0]);addPart(g,box(.46,.28,1.55,'coral'),1.0,.13,.3,[0,.3,0]);addPart(g,cylinder(.3,.7,'steel'),0,.18,1.32,[Math.PI/2,0,0]);} if(variant===2){addPart(g,box(2.65,.18,.55,'coral'),0,.07,-.05);addPart(g,box(.4,.35,.9,'steel'),-.92,.17,.6);addPart(g,box(.4,.35,.9,'steel'),.92,.17,.6);} if(variant===3){addPart(g,box(.4,.22,1.7,'coral'),-1.05,.08,.25,[0,-.48,0]);addPart(g,box(.4,.22,1.7,'coral'),1.05,.08,.25,[0,.48,0]);addPart(g,cone(.3,.7,'steel'),0,.2,1.38,[-Math.PI/2,0,0]);} addPart(g,cone(.18,.45,'amber'),0,.16,1.38,[-Math.PI/2,0,0]);return g; }
  function courierModel(){const g=new THREE.Group();addPart(g,box(2.3,.65,1.45,'warm'),0,.3,0);addPart(g,box(.85,.58,1.72,'steel'),0,.43,-.55);addPart(g,box(.7,.7,.95,'warm'),-1.48,.3,.08);addPart(g,box(.7,.7,.95,'warm'),1.48,.3,.08);addPart(g,cone(.18,.5,'amber'),-.65,.25,1.04,[-Math.PI/2,0,0]);addPart(g,cone(.18,.5,'amber'),.65,.25,1.04,[-Math.PI/2,0,0]);return g;}
  function stationModel(){const g=new THREE.Group();const ring=mesh('station-ring',()=>new THREE.TorusGeometry(3.1,.38,8,24),'steel',constants.steel,constants.cyan,.35);ring.rotation.x=Math.PI/2;g.add(ring);for(let i=0;i<6;i++){const arm=box(.22,.24,2.7,'steel');arm.rotation.y=i*Math.PI/3;g.add(arm)}addPart(g,cylinder(.9,1.1,'steel'),0,.65,0);addPart(g,cylinder(.54,.75,'cyan'),0,1.45,0);for(let i=0;i<8;i++){const light=cone(.1,.25,'cyan');light.position.set(Math.cos(i*Math.PI/4)*3.1,.04,Math.sin(i*Math.PI/4)*3.1);light.rotation.x=Math.PI/2;g.add(light)}return g;}
  function wreckModel(){const g=new THREE.Group();addPart(g,box(2.6,.6,1.3,'steel'),0,.24,0,[.2,.4,-.1]);addPart(g,box(1.15,.42,2.4,'steel'),.65,.2,.42,[0,-.7,.18]);addPart(g,cone(.55,1.4,'green'),-.82,.45,-.45,[Math.PI/2,.4,0]);for(let i=0;i<4;i++)addPart(g,box(.38,.25,.6,'steel'),Math.cos(i)*2,.12,Math.sin(i)*1.3,[0,i,0]);return g;}
  function beaconModel(){const g=new THREE.Group();const base=mesh('beacon-base',()=>new THREE.TorusGeometry(.72,.12,8,18),'amber',constants.amber,constants.amber,.7);base.rotation.x=Math.PI/2;g.add(base);addPart(g,cylinder(.08,3.7,'amber'),0,1.85,0);addPart(g,cone(.2,.5,'amber'),0,3.85,0);return g;}
  function pickupModel(){const g=new THREE.Group();const c=mesh('pickup-crystal',()=>new THREE.OctahedronGeometry(.3,0),'cyan',constants.cyanLite,constants.cyan,.9);g.add(c);const r=mesh('pickup-ring',()=>new THREE.TorusGeometry(.48,.045,6,12),'cyan',constants.cyan,constants.cyan,.65);r.rotation.x=Math.PI/2;g.add(r);return g;}

  function makeLabel(entity, tone, text, detail=''){ const el=document.createElement('div'); el.className=`worldLabel ${tone}`; el.innerHTML=`${text}${detail?`<small>${detail}</small>`:''}`; $('#hud').append(el); state.labels.set(entity.id,el); }
  function createEntity({name,category,kind='ship',position=[0,0],model,hostile=false,neutral=false,label,tone='cyanText',detail=''}) { const entity={id:ids.next++,name,category,kind,pos:new THREE.Vector3(position[0],0,position[1]),object:model(),hostile,neutral,aggressive:false,pendingDestroy:false,hp:hostile?100:999,velocity:new THREE.Vector3(),cooldown:0,dropDelay:0};entity.object.position.copy(entity.pos);state.scene.add(entity.object);state.entities.set(entity.id,entity);if(label)makeLabel(entity,tone,label,detail);return entity; }
  function addEvent(text, tone=''){state.events.unshift(text);state.events=state.events.slice(0,3);hud.events.innerHTML=state.events.map((e,i)=>`<div class="event ${i===1?'green':''}">${e}</div>`).join('');}
  function getByName(name){return [...state.entities.values()].find(e=>e.name===name&&!e.pendingDestroy)||null}
  function createWorld(){
    state.entities.clear(); state.labels.forEach(el=>el.remove()); state.labels.clear(); state.projectiles=[]; state.targetId=null; state.selectedId=null; state.stats={shots:{player:0,hostile:0},pickups:0,creditsAwarded:0};state.events=['Vanta Reach relay online','Salvage signatures detected'];hud.events.innerHTML='<div class="event">Vanta Reach relay online</div><div class="event green">Salvage signatures detected</div>';
    const player=createEntity({name:'Kestrel',category:'player corvette',position:[0,4],model:playerModel,label:'',tone:'cyanText'});player.hp=100;player.credits=0;player.facing=0;player.weaponFacing=0;state.playerId=player.id;
    createEntity({name:'Lattice Haven',category:'station',kind:'station',position:[4,-12],model:stationModel,label:'LATTICE HAVEN',tone:'cyanText',detail:'NEUTRAL RELAY'});
    createEntity({name:'Hawk',category:'courier',position:[-8,-5],model:courierModel,label:'COURIER · HAWK',tone:'amber',detail:'CIVILIAN TRAFFIC'});
    createEntity({name:'Beacon Alpha',category:'navigation beacon',kind:'beacon',position:[10,-1],model:beaconModel,label:'BEACON ALPHA',tone:'amber',detail:'1680m'});
    createEntity({name:'T-17',category:'wreck',kind:'wreck',position:[14,5],model:wreckModel,label:'WRECK · T-17',tone:'greenText',detail:'SALVAGE AVAILABLE'});
    const enemies=[['Red Vesper',[-12,-9]],['Talon',[12,-8]],['Sable Pike',[-11,11]],['Ember Coil',[10,13]]];enemies.forEach(([name,pos],i)=>createEntity({name,category:'hostile',position:pos,model:()=>hostileModel(i),hostile:true,label:'',tone:'coral'}));
    [[-8,0],[8,0],[2,-8],[-2,-10],[9,8],[-10,-3]].forEach((p,i)=>createEntity({name:`Salvage ${i+1}`,category:'salvage',kind:'pickup',position:p,model:pickupModel}));
    for(let i=0;i<82;i++){const d=mesh('debris',()=>new THREE.DodecahedronGeometry(.16,0),'steel',0x3f4b58);d.position.set(((i*37)%37)-18,.05,((i*19)%34)-16);d.scale.setScalar(.45+(i%4)*.18);state.scene.add(d);}
  }
  function createBackdrop(){
    const starGeo=getGeo('stars',()=>new THREE.BufferGeometry());const points=[];for(let i=0;i<700;i++){points.push(((i*97)%191)-95,10+((i*29)%13),((i*53)%191)-95)}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(points,3));const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xa4cad8,size:.16,sizeAttenuation:true,transparent:true,opacity:.68}));state.scene.add(stars);
    const grid=new THREE.GridHelper(145,38,0x071c2c,0x04101a);grid.position.y=-.04;state.scene.add(grid);
  }
  function removeEntity(id){const e=state.entities.get(id);if(!e)return;e.pendingDestroy=true;state.scene.remove(e.object);e.object.traverse(o=>{if(o.isMesh){o.visible=false}});state.labels.get(id)?.remove();state.labels.delete(id);state.entities.delete(id);if(state.targetId===id)state.targetId=null;if(state.selectedId===id)state.selectedId=null;}
  function spawnPickupNear(pos){const offset=new THREE.Vector3((Math.random()-.5)*1.5,0,(Math.random()-.5)*1.5);const p=createEntity({name:`Recovered crystal ${ids.next}`,category:'salvage',kind:'pickup',position:[pos.x+offset.x,pos.z+offset.z],model:pickupModel});p.velocity.set((Math.random()-.5)*2,0,(Math.random()-.5)*2);p.dropDelay=.45;return p.id;}
  function destroyHostile(name){const e=getByName(name);if(!e||!e.hostile)return;for(let i=0;i<4;i++)spawnPickupNear(e.pos);addEvent(`${e.name} hull fractured — salvage loose`,'green');removeEntity(e.id);}
  function setTarget(entity){state.targetId=entity?.id||null; if(entity){hud.targetName.textContent=`RAIDER · ${entity.name.toUpperCase()}`;hud.targetState.textContent='HOSTILE LOCK';}else{hud.targetName.textContent='SECTOR CONTACTS';hud.targetState.textContent='SCAN PASSIVE';}}
  function player(){return state.entities.get(state.playerId)}
  function selectByName(name){const e=getByName(name);state.selectedId=e?.id||null;hud.interact.hidden=!(e?.kind==='station');if(e?.kind==='station')addEvent('Lattice Haven docking channel selected');}
  function forceAggro(name){const e=getByName(name);if(e?.hostile){e.aggressive=true;addEvent(`${e.name} has entered threat range`);}}
  function moveNear(name,distance){const e=getByName(name),p=player();if(e&&p){const dir=e.pos.clone().sub(p.pos).setY(0).normalize();p.pos.copy(e.pos).addScaledVector(dir,-distance);}}
  function disengage(){setTarget(null);state.suppressedUntil=performance.now()+3000;addEvent('Combat lock disengaged');}
  function fireProjectile(origin, target, hostile=false){const bolt=mesh('bolt',()=>new THREE.CylinderGeometry(.055,.055,1.15,6),hostile?'coral':'cyan',hostile?constants.coral:constants.cyan,hostile?constants.coral:constants.cyan,1);const start=origin.pos.clone().add(new THREE.Vector3(0,.32,0));bolt.position.copy(start);const dir=target.pos.clone().sub(origin.pos).setY(0).normalize();bolt.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);state.scene.add(bolt);state.projectiles.push({object:bolt,pos:start,dir,owner:origin.id,hostile,life:1.1,range:22});if(hostile)state.stats.shots.hostile++;else state.stats.shots.player++;}
  function updatePlayer(dt){const p=player();if(!p)return;let x=state.input.x,z=state.input.z;for(const key of state.keys){if(key==='KeyW'||key==='ArrowUp')z-=1;if(key==='KeyS'||key==='ArrowDown')z+=1;if(key==='KeyA'||key==='ArrowLeft')x-=1;if(key==='KeyD'||key==='ArrowRight')x+=1}if(x||z){const len=Math.hypot(x,z)||1;x/=len;z/=len;p.pos.x+=x*8*dt;p.pos.z+=z*8*dt;p.facing=Math.atan2(x,-z);p.object.rotation.y=-p.facing;}p.object.position.copy(p.pos);}
  function updateCombat(dt,now){const p=player();if(!p)return;for(const e of state.entities.values()){if(!e.hostile)continue;const dist=e.pos.distanceTo(p.pos);if(now-state.startedAt>4200&&dist<15)e.aggressive=true;if(e.aggressive&&now-state.startedAt>3000&&e.cooldown<=0&&dist<14){fireProjectile(e,p,true);e.cooldown=1.6;}e.cooldown-=dt;}let target=state.entities.get(state.targetId);if(target&&(!target.hostile||!target.aggressive||target.pendingDestroy||target.pos.distanceTo(p.pos)>20))target=null;if(!target&&now>state.suppressedUntil){const elig=[...state.entities.values()].filter(e=>e.hostile&&e.aggressive&&!e.pendingDestroy&&e.pos.distanceTo(p.pos)<15).sort((a,b)=>a.pos.distanceTo(p.pos)-b.pos.distanceTo(p.pos));target=elig[0];if(target)setTarget(target);}if(target){p.weaponFacing=Math.atan2(target.pos.x-p.pos.x,-(target.pos.z-p.pos.z));if(p.cooldown<=0&&target.pos.distanceTo(p.pos)<13){fireProjectile(p,target,false);p.cooldown=.5;}}p.cooldown-=dt;}
  function updateProjectiles(dt){for(const shot of [...state.projectiles]){shot.life-=dt;shot.pos.addScaledVector(shot.dir,20*dt);shot.object.position.copy(shot.pos);if(shot.life<=0){state.scene.remove(shot.object);state.projectiles.splice(state.projectiles.indexOf(shot),1);continue;}const candidates=[...state.entities.values()].filter(e=>shot.hostile?e.id===state.playerId:e.hostile);for(const target of candidates){if(target.pendingDestroy||target.id===shot.owner)continue;if(shot.pos.distanceTo(target.pos)<.8){state.scene.remove(shot.object);state.projectiles.splice(state.projectiles.indexOf(shot),1);if(!shot.hostile){target.hp-=30;if(target.hp<=0)destroyHostile(target.name)}break;}}}}
  function updatePickups(dt){const p=player();for(const e of [...state.entities.values()]){if(e.kind!=='pickup')continue;e.dropDelay-=dt;e.pos.addScaledVector(e.velocity,dt);e.velocity.multiplyScalar(.95);const delta=p.pos.clone().sub(e.pos);const d=delta.length();if(e.dropDelay<=0&&d<7)e.velocity.addScaledVector(delta.normalize(),dt*13);e.object.position.copy(e.pos);e.object.rotation.y+=dt*2;if(e.dropDelay<=0&&d<.75){p.credits+=5;state.stats.pickups++;state.stats.creditsAwarded+=5;addEvent('+5 credits · salvage recovered','green');removeEntity(e.id);}}}
  function updateCamera(){const p=player();if(!p)return;const focus=p.pos.clone();state.camera.position.set(focus.x,28,focus.z+25);state.camera.lookAt(focus.x,0,focus.z-2);}
  function updateLabels(){const w=innerWidth,h=innerHeight;for(const [id,el] of state.labels){const e=state.entities.get(id);if(!e){el.remove();continue;}const v=e.pos.clone().add(new THREE.Vector3(0,1.2,0)).project(state.camera);const x=(v.x*.5+.5)*w,y=(-v.y*.5+.5)*h;el.style.left=`${x}px`;el.style.top=`${y}px`;el.style.display=v.z<1?'block':'none';}}
  const invariants=()=>{const errors=[];const p=player();if(!p)errors.push('player missing');if(state.targetId&&!state.entities.has(state.targetId))errors.push('target points to removed entity');if(state.selectedId&&!state.entities.has(state.selectedId))errors.push('selection points to removed entity');if(state.loopCount!==1)errors.push('animation loop count is not one');if([...state.entities.values()].some(e=>e.pendingDestroy))errors.push('pending destroy remains selectable');return{pass:errors.length===0,errors};};
  function snapshot(){const p=player();return{backend:state.renderer?.backend?.isWebGPUBackend?'WebGPU':'WebGL2',player:p&&{id:p.id,pos:[p.pos.x,0,p.pos.z],facing:p.facing,weaponFacing:p.weaponFacing,hp:p.hp,credits:p.credits},targetId:state.targetId,selectedId:state.selectedId,entities:[...state.entities.values()].map(e=>({id:e.id,name:e.name,category:e.category,kind:e.kind,pos:[e.pos.x,0,e.pos.z],aggressive:e.aggressive})),events:[...state.events],stats:JSON.parse(JSON.stringify(state.stats)),restartCount:state.restartCount,invariants:{...invariants(),loopCount:state.loopCount}}}
  function clearInput(){state.keys.clear();state.input.x=0;state.input.z=0;$('#stick').style.transform='translate(-50%,-50%)';}
  function setPlayerPosition(x,z){const p=player();p.pos.set(x,0,z);p.object.position.copy(p.pos);}
  function resize(){if(!state.renderer)return;state.renderer.setPixelRatio(Math.min(devicePixelRatio,2));state.renderer.setSize(innerWidth,innerHeight);state.camera.aspect=innerWidth/innerHeight;state.camera.updateProjectionMatrix();}
  function restart(){clearInput();state.restartCount++;for(const e of [...state.entities.values()])state.scene.remove(e.object);for(const label of state.labels.values())label.remove();createWorld();hud.interact.hidden=true;}
  function tick(){if(state.disposed)return;try{const dt=Math.min(state.clock.getDelta(),.05),now=performance.now();updatePlayer(dt);updateCombat(dt,now);updateProjectiles(dt);updatePickups(dt);updateCamera();updateLabels();const p=player();hud.hp.textContent=Math.round(p.hp);hud.credits.textContent=p.credits.toLocaleString();state.renderer.render(state.scene,state.camera);state.frame++;}catch(error){stageError('UPDATE',error);state.renderer.setAnimationLoop(null);}}
  async function bootstrap(){try{state.scene=new THREE.Scene();state.scene.background=new THREE.Color(0x02060d);state.camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,260);state.clock=new THREE.Clock();state.renderer=new THREE.WebGPURenderer({antialias:true,alpha:false});await state.renderer.init();state.renderer.outputColorSpace=THREE.SRGBColorSpace;state.renderer.domElement.setAttribute('aria-label','Interactive hostile space sector');game.prepend(state.renderer.domElement);state.scene.add(new THREE.HemisphereLight(0x74c9e6,0x07101c,1.35));const key=new THREE.DirectionalLight(0xb7edff,2.6);key.position.set(-12,22,12);state.scene.add(key);const rim=new THREE.DirectionalLight(0xff8b72,1.25);rim.position.set(14,12,-20);state.scene.add(rim);createBackdrop();createWorld();resize();state.loopCount=1;state.renderer.setAnimationLoop(tick);state.ready=true;}catch(error){stageError('RENDERER',error);throw error;}}
  window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){e.preventDefault();state.keys.add(e.code)}});window.addEventListener('keyup',e=>state.keys.delete(e.code));window.addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput()});window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);
  const joystick=$('#joystick'),stick=$('#stick');let pointer=null;const drag=e=>{const r=joystick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),lim=r.width*.27,len=Math.hypot(dx,dy)||1,x=Math.max(-lim,Math.min(lim,dx)),y=Math.max(-lim,Math.min(lim,dy));state.input.x=x/lim;state.input.z=y/lim;stick.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;};joystick.addEventListener('pointerdown',e=>{pointer=e.pointerId;joystick.setPointerCapture(pointer);drag(e)});joystick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)drag(e)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>joystick.addEventListener(t,()=>{pointer=null;clearInput()}));
  $('#restart').addEventListener('click',restart);$('#disengage').addEventListener('click',disengage);hud.interact.addEventListener('click',()=>{addEvent('Lattice Haven traffic data received');hud.interact.hidden=true;});
  game.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('#joystick'))return;const rect=game.getBoundingClientRect(),x=(e.clientX/rect.width)*2-1,y=-(e.clientY/rect.height)*2+1;let closest=null,best=.12;for(const entity of state.entities.values()){if(!entity.hostile&&!['station','wreck','beacon'].includes(entity.kind))continue;const v=entity.pos.clone().project(state.camera),d=Math.hypot(v.x-x,v.y-y);if(d<best){best=d;closest=entity}}if(closest){if(closest.hostile&&state.targetId===closest.id)disengage();else if(closest.hostile){forceAggro(closest.name);setTarget(closest)}else selectByName(closest.name)}});
  window.__haio={get ready(){return state.ready},snapshot,clearInput,setPlayerPosition,moveNear,forceAggro,disengage,destroyHostile,spawnPickupNear:distance=>spawnPickupNear(player().pos.clone().add(new THREE.Vector3(distance,0,0))),restart,selectByName};
  await bootstrap();
</script>
