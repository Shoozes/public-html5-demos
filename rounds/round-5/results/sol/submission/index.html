  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--cyan:#50eaff;--coral:#ff665f;--amber:#ffb44b;--green:#94f28a;--panel:rgba(2,10,20,.78)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020812;color:#d9f8ff}body{touch-action:none;user-select:none}
    #app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 60% 25%,rgba(11,64,87,.22),transparent 39%),radial-gradient(ellipse at 15% 75%,rgba(12,46,82,.18),transparent 45%),#020812}
    canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;outline:0}
    #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.world-label{position:absolute;transform:translate(-50%,8px);font-size:10px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 5px #000,0 0 8px currentColor;color:#8ceeff;opacity:.9}.world-label.hostile{color:#ff756e}.world-label.neutral{color:#ffc267}.world-label.wreck{color:#9df18d}.world-label.hidden{display:none}
    .hud{position:absolute;z-index:4;pointer-events:none}.panel{background:linear-gradient(135deg,var(--panel),rgba(2,13,26,.42));border:1px solid rgba(57,211,238,.28);clip-path:polygon(0 0,92% 0,100% 25%,100% 100%,0 100%);box-shadow:inset 0 0 24px rgba(18,160,189,.05);backdrop-filter:blur(3px)}
    #playerHud{left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));width:250px;padding:12px 14px}#targetHud{right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));width:215px;padding:12px 14px;border-color:rgba(255,102,95,.32);clip-path:polygon(8% 0,100% 0,100% 100%,0 100%,0 25%)}
    .eyebrow{font-size:11px;letter-spacing:.14em;color:#69ddec}.title{margin-top:2px;font-size:15px;letter-spacing:.06em}.bar{height:8px;margin:9px 0 5px;border:1px solid rgba(100,235,255,.35);background:rgba(0,0,0,.35)}.fill{height:100%;width:100%;background:linear-gradient(90deg,#27c6da,#75efff);box-shadow:0 0 10px rgba(80,234,255,.45)}#targetFill{background:linear-gradient(90deg,#ff504a,#ff8d79);box-shadow:0 0 10px rgba(255,92,78,.4)}.row{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#91bcc5}.value{color:#e8fbff;font-variant-numeric:tabular-nums}#credits{color:var(--cyan);font-size:17px;margin-top:5px}
    #eventFeed{left:max(24px,env(safe-area-inset-left));bottom:118px;width:min(360px,58vw);font-size:12px;line-height:1.7;color:#b5d6dc;text-shadow:0 1px 4px #000}.event{padding-left:12px;border-left:1px solid rgba(80,234,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event::before{content:'>';color:var(--amber);margin-right:8px}.event:nth-last-child(1)::before{color:var(--green)}
    #actions{right:max(16px,env(safe-area-inset-right));top:104px;display:flex;flex-direction:column;gap:7px;pointer-events:auto;align-items:flex-end}.action{appearance:none;border:1px solid rgba(84,222,244,.36);background:rgba(3,18,31,.76);color:#bceff5;border-radius:2px;padding:8px 10px;font:600 10px/1 system-ui;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}.action:hover,.action:focus-visible{border-color:var(--cyan);color:#fff;outline:none}.action[hidden]{display:none}#disengage{border-color:rgba(255,102,95,.45);color:#ff9a92}
    #joystick{position:absolute;z-index:5;left:max(22px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:150px;height:150px;border:1px solid rgba(36,204,237,.7);border-radius:50%;background:radial-gradient(circle,rgba(31,119,150,.12) 0 20%,transparent 21% 48%,rgba(28,142,174,.08) 49% 50%,transparent 51%);box-shadow:0 0 26px rgba(22,175,208,.08),inset 0 0 24px rgba(10,93,123,.1);pointer-events:auto;touch-action:none}.stick{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border:1px solid rgba(114,231,250,.75);border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(116,232,255,.36),rgba(7,31,48,.8));box-shadow:0 0 14px rgba(51,204,235,.2)}
    #radarWrap{position:absolute;z-index:4;right:max(22px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:150px;height:150px;border:1px solid rgba(36,204,237,.65);border-radius:50%;background:rgba(2,15,26,.58);box-shadow:0 0 25px rgba(26,174,205,.08);pointer-events:none}#radar{width:100%;height:100%}
    #selected{left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:320px;text-align:center;font-size:11px;color:#c9f8ff;letter-spacing:.06em;text-shadow:0 1px 4px #000}
    #loading,#error{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#020812;text-align:center;padding:24px}#loading .loadbox{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#79d8e8}#loading .pulse{width:36px;height:36px;margin:0 auto 16px;border:1px solid var(--cyan);transform:rotate(45deg);animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{transform:rotate(45deg) scale(.72);opacity:.35}}#error{display:none;background:rgba(2,5,11,.96);color:#ff9e96}#error strong{display:block;margin-bottom:10px;color:#ff625b;letter-spacing:.08em;text-transform:uppercase}#error pre{max-width:720px;white-space:pre-wrap;text-align:left;color:#ffd1cc;font:12px/1.5 ui-monospace,monospace}

    @media(max-width:600px){#playerHud{left:10px;top:10px;width:158px;padding:9px 10px}#targetHud{right:10px;top:10px;width:144px;padding:9px 10px}.eyebrow{font-size:8px}.title{font-size:10px}.bar{height:6px;margin:6px 0 3px}.row{font-size:8px}#credits{font-size:13px}.action{padding:7px 8px;font-size:8px}#actions{right:10px;top:82px}#joystick,#radarWrap{width:112px;height:112px;bottom:max(15px,env(safe-area-inset-bottom))}#joystick{left:15px}#radarWrap{right:15px}.stick{width:38px;height:38px;margin:-19px}#eventFeed{left:16px;bottom:139px;width:240px;font-size:9px;line-height:1.55}#selected{bottom:137px;font-size:9px;max-width:180px}.world-label{font-size:7px}}

<body>
<main id="app" aria-label="Velorum Drift hostile-space sector">
  <canvas id="game" tabindex="0" aria-label="Playable hostile-space sector"></canvas><div id="labels"></div><div id="damageFlash"></div>
  <section id="playerHud" class="hud panel"><div class="eyebrow">CORVETTE · AEGIS</div><div class="bar"><div id="hullFill" class="fill"></div></div><div class="row"><span>HULL</span><span id="hullText" class="value">100 / 100</span></div><div id="credits">0 CR</div></section>
  <section id="targetHud" class="hud panel"><div class="eyebrow" style="color:#ff8178">TACTICAL LOCK</div><div id="targetName" class="title">NO THREAT</div><div class="bar"><div id="targetFill" class="fill" style="width:0"></div></div><div class="row"><span id="targetState">PASSIVE</span><span id="targetHp" class="value">--</span></div></section>
  <div id="actions" class="hud"><button id="interact" class="action" hidden>Request docking telemetry</button><button id="disengage" class="action" hidden>Disengage lock</button><button id="restart" class="action" aria-label="Restart">Restart</button><button id="fullscreen" class="action">Fullscreen</button></div>
  <div id="eventFeed" class="hud" aria-live="polite"></div><div id="selected" class="hud"></div>
  <div id="joystick" aria-label="Movement joystick"><div class="stick"></div></div><div id="radarWrap"><canvas id="radar" width="300" height="300"></canvas></div>
  <div id="loading"><div class="loadbox"><div class="pulse"></div><span id="stage">Preparing navigation core</span></div></div><div id="error"><div><strong>Navigation core halted</strong><pre id="errorText"></pre></div></div>
</main>
<script type="module">
const $=id=>document.getElementById(id), canvas=$('game'), stage=$('stage'), errorPanel=$('error'), errorText=$('errorText');
window.__haio={ready:false};
let renderer,loopStarted=false,THREE,TSL;
const fail=(phase,error)=>{const message=`${phase}: ${error?.stack||error?.message||error}`;console.error(message);stage.textContent='Startup halted';errorText.textContent=message;errorPanel.style.display='grid';$('loading').style.display='none';if(renderer&&loopStarted){renderer.setAnimationLoop(null);loopStarted=false}};
try{stage.textContent='Loading pinned navigation modules';[THREE,TSL]=await Promise.all([import('three'),import('three/tsl')])}catch(error){fail('IMPORT',error);throw error}

try{
const query=new URLSearchParams(location.search), silhouette=query.has('silhouette'), firstFrame=query.get('milestone')==='first-frame', seed=5105;
stage.textContent='Initializing renderer';
renderer=new THREE.WebGPURenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x020812,1);await renderer.init();
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(),clock=new THREE.Clock(),raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const worldRoot=new THREE.Group(),fxRoot=new THREE.Group();scene.add(worldRoot,fxRoot);
scene.add(new THREE.HemisphereLight(0x91dce8,0x09101c,1.7));const key=new THREE.DirectionalLight(0xb6eaff,3.4);key.position.set(-25,42,30);scene.add(key);const rim=new THREE.DirectionalLight(0xffa158,1.25);rim.position.set(28,18,-24);scene.add(rim);
const sharedGeometry=new Map(),sharedMaterial=new Map(),entities=new Map(),representations=new Map(),labels=new Map(),projectiles=[];
let nextId=1,player=null,targetId=null,selectedId=null,restartCount=0,worldAge=0,disengageUntil=0,lastTime=performance.now(),portrait=false,animationToken=1;
const input={keys:new Set(),joyX:0,joyY:0},stats={shots:{player:0,hostile:0},pickups:0,creditsAwarded:0,destroyed:0},events=[];
const G=(key,make)=>{if(!sharedGeometry.has(key))sharedGeometry.set(key,make());return sharedGeometry.get(key)};
const M=(key,base,emissive=0x000000,emit=0)=>{if(silhouette)return new THREE.MeshBasicMaterial({color:base});if(!sharedMaterial.has(key)){const m=new THREE.MeshStandardNodeMaterial();m.colorNode=TSL.color(base);m.emissiveNode=TSL.color(emissive).mul(TSL.float(emit));m.roughness=.48;m.metalness=.58;sharedMaterial.set(key,m)}return sharedMaterial.get(key)};
const mesh=(geo,mat,pos=[0,0,0],rot=[0,0,0],scale=[1,1,1])=>{const o=new THREE.Mesh(geo,mat);o.position.set(...pos);o.rotation.set(...rot);o.scale.set(...scale);o.castShadow=false;o.receiveShadow=false;return o};
const box=(sx,sy,sz,mat,pos,rot)=>mesh(G(`b${sx},${sy},${sz}`,()=>new THREE.BoxGeometry(sx,sy,sz,1,1,1)),mat,pos,rot);
const cone=(r,h,n,mat,pos,rot=[-Math.PI/2,0,0])=>mesh(G(`c${r},${h},${n}`,()=>new THREE.ConeGeometry(r,h,n)),mat,pos,rot);
const cyl=(r,h,n,mat,pos,rot=[0,0,0])=>mesh(G(`y${r},${h},${n}`,()=>new THREE.CylinderGeometry(r,r,h,n)),mat,pos,rot);
const sphere=(r,n,mat,pos,scale)=>mesh(G(`s${r},${n}`,()=>new THREE.IcosahedronGeometry(r,n)),mat,pos,[0,0,0],scale);
const torus=(r,t,n,mat,pos,rot=[Math.PI/2,0,0])=>mesh(G(`t${r},${t},${n}`,()=>new THREE.TorusGeometry(r,t,8,n)),mat,pos,rot);
const mats={player:M('player',silhouette?0xf5f5f5:0x239eb0,0x22dff2,.12),playerDark:M('playerDark',silhouette?0xbdbdbd:0x123c51,0x0b6576,.05),glass:M('glass',silhouette?0xe3e3e3:0x68ddeb,0x49e7ff,.18),engine:M('engine',silhouette?0xffffff:0xff9238,0xff731c,2.6),hostile:M('hostile',silhouette?0xd6d6d6:0xc74742,0xff4b43,.12),hostileDark:M('hostileDark',silhouette?0x8f8f8f:0x52262c,0x6b1d23,.04),neutral:M('neutral',silhouette?0xaaaaaa:0x9a7b4c,0xf5a338,.08),steel:M('steel',silhouette?0x8a8a8a:0x4b6870,0x28cbd8,.07),station:M('station',silhouette?0x8a8a8a:0x304950,0x168c9a,.035),wreck:M('wreck',silhouette?0x777777:0x5d574e,0x66e66e,.05),green:M('green',silhouette?0xffffff:0x5fb46b,0x54ff77,1.7),amber:M('amber',silhouette?0xffffff:0xd88a2e,0xffa124,2.2),pickup:M('pickup',silhouette?0xf0f0f0:0x43cfda,0x33eaff,1.8),boltP:M('boltP',0x98f7ff,0x55eaff,3),boltH:M('boltH',0xff9a7c,0xff4b3d,3),debris:M('debris',0x24303a,0x07121d,.02)};

function playerModel(){const g=new THREE.Group();g.add(box(1.8,.65,3.5,mats.player,[0,.4,.1]),cone(1.25,2,4,mats.player,[0,.38,-2.45]),box(2.7,.22,2.2,mats.player,[-1.75,.24,.1],[0,.46,-.08]),box(2.7,.22,2.2,mats.player,[1.75,.24,.1],[0,-.46,.08]),sphere(.72,1,mats.glass,[0,.9,-.55],[1,.62,1.35]),cyl(.38,1.6,10,mats.playerDark,[-.9,.35,1.9],[-Math.PI/2,0,0]),cyl(.38,1.6,10,mats.playerDark,[.9,.35,1.9],[-Math.PI/2,0,0]),sphere(.32,1,mats.engine,[-.9,.35,2.75],[1,1,1.8]),sphere(.32,1,mats.engine,[.9,.35,2.75],[1,1,1.8]));const weapon=new THREE.Group();weapon.name='weaponPivot';weapon.position.set(0,.8,-.4);weapon.add(box(.22,.18,2,mats.glass,[0,0,-1]));g.add(weapon);g.scale.setScalar(1.22);return g}
function hostileModel(variant){const g=new THREE.Group();g.add(box(1.35,.52,3.15,mats.hostile,[0,.35,0]),cone(1.05,1.85,4,mats.hostile,[0,.34,-2.25]));if(variant===0){g.add(box(2.4,.2,1.5,mats.hostileDark,[-1.45,.18,.25],[0,.55,.12]),box(1.3,.22,2.2,mats.hostile,[1.3,.22,.55],[0,-.28,0]))}else if(variant===1){g.add(box(1,.25,3,mats.hostileDark,[-1.2,.2,.7],[0,.22,.18]),box(1,.25,3,mats.hostileDark,[1.2,.2,.7],[0,-.22,-.18]),box(2.8,.18,.7,mats.hostile,[0,.25,1.5]))}else if(variant===2){g.add(cyl(.5,1.8,8,mats.hostileDark,[-1.5,.35,.6],[-Math.PI/2,0,0]),cyl(.5,1.8,8,mats.hostileDark,[1.5,.35,.6],[-Math.PI/2,0,0]),box(3.3,.2,1.15,mats.hostile,[0,.18,.25]))}else{g.add(box(3.8,.24,2.2,mats.hostile,[0,.2,.45]),box(1.3,.45,1.6,mats.hostileDark,[0,.55,1.25]),cone(.62,1.4,3,mats.hostileDark,[-1.6,.35,1.65]),cone(.62,1.4,3,mats.hostileDark,[1.6,.35,1.65]))}g.add(sphere(.28,1,mats.engine,[-.48,.35,1.85]),sphere(.28,1,mats.engine,[.48,.35,1.85]));g.scale.setScalar(1.05);return g}
function courierModel(){const g=new THREE.Group();g.add(box(2.1,.75,3.3,mats.neutral,[0,.42,0]),box(1.25,1,2.2,mats.steel,[-1.65,.42,.35]),box(1.25,1,2.2,mats.steel,[1.65,.42,.35]),box(1.25,.35,1.1,mats.neutral,[0,.88,-1.25]),sphere(.3,1,mats.engine,[-.6,.4,1.82]),sphere(.3,1,mats.engine,[.6,.4,1.82]));return g}
function stationModel(){const g=new THREE.Group();g.add(torus(5.4,.65,28,mats.station,[0,1.2,0]),cyl(1.55,1.2,12,mats.station,[0,1.2,0]),cyl(.75,2.8,10,mats.playerDark,[0,2.8,0]),torus(1.25,.2,20,mats.glass,[0,4.15,0]));for(let i=0;i<4;i++){const a=i*Math.PI/2;const strut=box(4.4,.3,.5,mats.station,[Math.cos(a)*2.6,1.2,Math.sin(a)*2.6],[0,-a,0]);g.add(strut);g.add(sphere(.2,1,mats.pickup,[Math.cos(a)*5.4,1.2,Math.sin(a)*5.4]))}return g}
function beaconModel(){const g=new THREE.Group();g.add(torus(1.45,.14,20,mats.amber,[0,.12,0]),torus(.75,.12,18,mats.amber,[0,.18,0]),cyl(.12,4.3,8,mats.amber,[0,2.25,0]),sphere(.28,1,mats.amber,[0,4.5,0]));return g}
function wreckModel(){const g=new THREE.Group();g.add(sphere(1.7,0,mats.wreck,[0,.55,0],[1.7,.65,1]),box(2.2,.55,1.3,mats.wreck,[-1.35,.35,.9],[.15,.55,.3]),cone(.9,2.5,4,mats.wreck,[1.4,.35,-.65],[-Math.PI/2,.5,.3]),sphere(.72,1,mats.green,[.25,.6,.15]));for(let i=0;i<5;i++)g.add(sphere(.35+i*.04,0,mats.wreck,[Math.sin(i*2.1)*(2.4+i*.22),.2,Math.cos(i*1.6)*(2+i*.2)]));return g}
function pickupModel(){const g=new THREE.Group();g.add(sphere(.48,0,mats.pickup,[0,.45,0],[.75,1.25,.75]),torus(.78,.06,18,mats.pickup,[0,.2,0]));g.scale.setScalar(.9);return g}
function selectionRing(color=0x64ecff){const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8,depthWrite:false});return torus(1.8,.045,28,m,[0,.05,0])}
function createLabel(e,kind=''){const d=document.createElement('div');d.className=`world-label ${kind}`;d.textContent=e.name;$('labels').append(d);labels.set(e.id,d)}
function spawn(spec,model){const e={...spec,id:nextId++,pos:new THREE.Vector3(...spec.pos),vel:new THREE.Vector3(),facing:spec.facing||0,weaponFacing:spec.facing||0,hp:spec.hp??1,maxHp:spec.hp??1,pendingDestroy:false,aggressive:false,cooldown:spec.cooldown??0,freeUntil:spec.freeUntil??0};entities.set(e.id,e);if(model){model.position.copy(e.pos);model.rotation.y=-e.facing;model.userData.entityId=e.id;worldRoot.add(model);representations.set(e.id,model);e.model=model}if(spec.label)createLabel(e,spec.label);return e}
function addEvent(text){if(events[events.length-1]===text)return;events.push(text);while(events.length>4)events.shift();$('eventFeed').innerHTML=events.map(x=>`<div class="event">${x}</div>`).join('')}
function layout(){portrait=innerHeight>innerWidth;const P=portrait?{station:[-19,0,-25],beacon:[4.5,0,-6],courier:[-4,0,-13],wreck:[4.5,0,12],hostiles:[[-5.5,0,-21],[5.5,0,-12],[-5.5,0,15],[5,0,26]],pickups:[[-4,0,-1],[4,0,3],[-2.5,0,20],[4.5,0,-18]]}:{station:[10,0,-23],beacon:[22,0,-6],courier:[-17,0,-12],wreck:[32,0,7],hostiles:[[-30,0,-20],[34,0,-14],[-29,0,21],[29,0,24]],pickups:[[-14,0,-1],[15,0,2],[-8,0,19],[25,0,-15]]};return P}
function buildWorld(){worldRoot.clear();fxRoot.clear();entities.clear();representations.clear();labels.forEach(d=>d.remove());labels.clear();projectiles.length=0;nextId=1;targetId=null;selectedId=null;worldAge=0;disengageUntil=0;Object.assign(stats,{shots:{player:0,hostile:0},pickups:0,creditsAwarded:0,destroyed:0});events.length=0;const P=layout();
  player=spawn({name:'Aegis Kestrel',kind:'ship',category:'player',faction:'player',pos:[0,0,4],hp:100,credits:0},playerModel());
  const stationEntity=spawn({name:'Lattice Haven',kind:'landmark',category:'station',faction:'neutral',pos:P.station,label:'neutral'},stationModel());if(portrait)stationEntity.model.scale.setScalar(.64);spawn({name:'Sable Relay',kind:'landmark',category:'navigation beacon',faction:'neutral',pos:P.beacon,label:'neutral'},beaconModel());
  if(!firstFrame||silhouette){const names=['Red Vesper','Ash Talon','Riven Pike','Cinder Maw'];P.hostiles.forEach((pos,i)=>spawn({name:names[i],kind:'ship',category:'hostile',faction:'hostile',pos,hp:80,cooldown:1+i*.2,label:'hostile',variant:i},hostileModel(i)));spawn({name:'Morrow Courier',kind:'ship',category:'neutral courier',faction:'neutral',pos:P.courier,hp:60,label:'neutral'},courierModel());spawn({name:'Wreck Nine',kind:'landmark',category:'wreck',faction:'neutral',pos:P.wreck,label:'wreck'},wreckModel());P.pickups.forEach((pos,i)=>spawn({name:`Drift shard ${i+1}`,kind:'pickup',category:'salvage',faction:'neutral',pos,value:5,freeUntil:99999},pickupModel()));}
  addEvent('Entered Velorum Drift');addEvent('Sable Relay telemetry online');updateHud()
}
function createBackground(){const grid=new THREE.GridHelper(240,48,0x15566a,0x092b3d);grid.position.y=-.35;grid.material.transparent=true;grid.material.opacity=.24;scene.add(grid);let s=seed;const rnd=()=>{s=Math.imul(s^s>>>15,1|s);s^=s+Math.imul(s^s>>>7,61|s);return((s^s>>>14)>>>0)/4294967296};const positions=[];for(let i=0;i<520;i++)positions.push((rnd()-.5)*260,rnd()*38+8,(rnd()-.5)*260);const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));const starMat=new THREE.PointsMaterial({color:0xaeddf5,size:.16,transparent:true,opacity:.72,sizeAttenuation:true});scene.add(new THREE.Points(geo,starMat));for(let i=0;i<55;i++){const shard=sphere(.25+rnd()*.55,0,mats.debris,[(rnd()-.5)*115,-.05,(rnd()-.5)*100],[1+rnd()*2,.5+rnd(),.7+rnd()*1.7]);shard.rotation.set(rnd()*3,rnd()*3,rnd()*3);scene.add(shard)}}
createBackground();buildWorld();
function resize(){const w=innerWidth,h=innerHeight,aspect=w/h,span=h>w?68:60;camera.left=-span*aspect/2;camera.right=span*aspect/2;camera.top=span/2;camera.bottom=-span/2;camera.near=.1;camera.far=300;camera.updateProjectionMatrix();renderer.setSize(w,h,false);renderer.setPixelRatio(Math.min(devicePixelRatio,2))}addEventListener('resize',resize,{passive:true});resize();
function clearInput(){input.keys.clear();input.joyX=0;input.joyY=0;const stick=document.querySelector('.stick');stick.style.transform='translate(0,0)'}
addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){input.keys.add(e.code);e.preventDefault()}});addEventListener('keyup',e=>input.keys.delete(e.code));addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput()});
const joy=$('joystick'),stick=joy.querySelector('.stick');let joyPointer=null;function joyMove(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.32,len=Math.hypot(dx,dy)||1,k=Math.min(1,max/len);input.joyX=dx/max*k;input.joyY=dy/max*k;stick.style.transform=`translate(${dx*k}px,${dy*k}px)`}joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joyMove(e)});const joyEnd=e=>{if(e.pointerId===joyPointer){joyPointer=null;input.joyX=input.joyY=0;stick.style.transform='translate(0,0)'}};joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
function eligibleHostiles(){return [...entities.values()].filter(e=>e.category==='hostile'&&!e.pendingDestroy&&e.aggressive)}
function validTarget(){const e=entities.get(targetId);return e&&!e.pendingDestroy&&e.category==='hostile'&&e.aggressive&&e.pos.distanceTo(player.pos)<40?e:null}
function acquireTarget(){if(worldAge<disengageUntil)return;if(validTarget())return;targetId=null;let best=null,d=34;for(const e of eligibleHostiles()){const q=e.pos.distanceTo(player.pos);if(q<d){best=e;d=q}}if(best){targetId=best.id;addEvent(`Tactical lock: ${best.name}`)}}
function fire(owner,target,isPlayer){const from=owner.pos.clone().add(new THREE.Vector3(0,.7,0)),dir=target.pos.clone().sub(owner.pos);dir.y=0;dir.normalize();const mat=isPlayer?mats.boltP:mats.boltH,body=box(.14,.12,1.2,mat,[0,0,0]);body.position.copy(from);body.rotation.y=-Math.atan2(dir.x,-dir.z);fxRoot.add(body);projectiles.push({mesh:body,pos:from,prev:from.clone(),dir,ownerId:owner.id,faction:owner.faction,lifetime:2.1,range:0,damage:isPlayer?16:7});stats.shots[isPlayer?'player':'hostile']++}
function segmentDistance(a,b,p){const ab=b.clone().sub(a),den=ab.lengthSq()||1,t=Math.max(0,Math.min(1,p.clone().sub(a).dot(ab)/den));return p.clone().sub(a.clone().addScaledVector(ab,t)).length()}
function destroyHostile(nameOrEntity){const e=typeof nameOrEntity==='string'?[...entities.values()].find(x=>x.name===nameOrEntity):nameOrEntity;if(!e||e.category!=='hostile'||e.pendingDestroy)return false;e.pendingDestroy=true;e.model.visible=false;if(targetId===e.id)targetId=null;if(selectedId===e.id)selectedId=null;stats.destroyed++;addEvent(`${e.name} disabled — salvage released`);for(let i=0;i<5;i++){const a=i*Math.PI*2/5;const p=spawn({name:`${e.name} salvage`,kind:'pickup',category:'salvage',faction:'neutral',pos:[e.pos.x+Math.cos(a)*.6,.2,e.pos.z+Math.sin(a)*.6],value:5,freeUntil:worldAge+.48},pickupModel());p.vel.set(Math.cos(a)*4.5,0,Math.sin(a)*4.5)}return true}
function cleanupEntity(e){e.model?.removeFromParent();representations.delete(e.id);labels.get(e.id)?.remove();labels.delete(e.id);entities.delete(e.id)}
function updateProjectiles(dt){for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.prev.copy(p.pos);p.pos.addScaledVector(p.dir,35*dt);p.range+=35*dt;p.lifetime-=dt;p.mesh.position.copy(p.pos);let hit=null;if(p.faction==='player'){for(const e of entities.values())if(e.category==='hostile'&&!e.pendingDestroy&&e.id!==p.ownerId&&segmentDistance(p.prev,p.pos,e.pos)<1.65){hit=e;break}}else if(player&&!player.pendingDestroy&&segmentDistance(p.prev,p.pos,player.pos)<1.35)hit=player;if(hit){hit.hp-=p.damage;if(hit===player){$('damageFlash').classList.add('on');setTimeout(()=>$('damageFlash').classList.remove('on'),120);if(hit.hp<=0){hit.hp=0;hit.pendingDestroy=true;clearInput();addEvent('Aegis disabled — restart available')}}else if(hit.hp<=0)destroyHostile(hit);p.lifetime=0}if(p.lifetime<=0||p.range>70){p.mesh.removeFromParent();projectiles.splice(i,1)}}}
function updatePickups(dt){for(const e of [...entities.values()]){if(e.kind!=='pickup'||e.pendingDestroy)continue;e.vel.multiplyScalar(Math.pow(.12,dt));e.pos.addScaledVector(e.vel,dt);if(worldAge>=e.freeUntil){const d=e.pos.distanceTo(player.pos);if(d<13){const pull=player.pos.clone().sub(e.pos).normalize();e.vel.addScaledVector(pull,22*dt*(1+(13-d)/13));if(d<1.25){e.pendingDestroy=true;player.credits+=e.value;stats.pickups++;stats.creditsAwarded+=e.value;addEvent(`Recovered ${e.value} drift credits`)}}}e.model.position.copy(e.pos);e.model.rotation.y+=dt*1.8;if(e.pendingDestroy)cleanupEntity(e)}}
function updateCombat(dt){for(const e of entities.values()){if(e.category!=='hostile'||e.pendingDestroy)continue;const d=e.pos.distanceTo(player.pos);if(worldAge>3&&d<24&&player.vel?.lengthSq()>0.1)e.aggressive=true;if(e.aggressive){e.cooldown-=dt;const dir=player.pos.clone().sub(e.pos);e.weaponFacing=Math.atan2(dir.x,-dir.z);if(d<28&&e.cooldown<=0&&!player.pendingDestroy){fire(e,player,false);e.cooldown=1.25+e.variant*.12}}}acquireTarget();const t=validTarget();if(t&&!player.pendingDestroy){const delta=t.pos.clone().sub(player.pos);player.weaponFacing=Math.atan2(delta.x,-delta.z);player.cooldown-=dt;if(delta.length()<29&&player.cooldown<=0){fire(player,t,true);player.cooldown=.34}}else player.cooldown=Math.max(0,(player.cooldown||0)-dt)}
function updatePlayer(dt){if(player.pendingDestroy)return;let x=(input.keys.has('KeyD')||input.keys.has('ArrowRight')?1:0)-(input.keys.has('KeyA')||input.keys.has('ArrowLeft')?1:0)+input.joyX,z=(input.keys.has('KeyS')||input.keys.has('ArrowDown')?1:0)-(input.keys.has('KeyW')||input.keys.has('ArrowUp')?1:0)+input.joyY;const len=Math.hypot(x,z);if(len>1){x/=len;z/=len}player.vel.set(x*14,0,z*14);player.pos.addScaledVector(player.vel,dt);if(len>.08)player.facing=Math.atan2(x,-z);player.model.position.copy(player.pos);player.model.rotation.y=-player.facing;const pivot=player.model.getObjectByName('weaponPivot');if(pivot)pivot.rotation.y=-(player.weaponFacing-player.facing)}
function updateCamera(){const target=player.pos;camera.position.set(target.x+27,45,target.z+35);camera.lookAt(new THREE.Vector3(target.x,0,target.z));camera.updateMatrixWorld()}
function updateLabels(){for(const [id,d] of labels){const e=entities.get(id);if(!e||e.pendingDestroy){d.classList.add('hidden');continue}const p=e.pos.clone().add(new THREE.Vector3(0,2.2,0)).project(camera);if(p.z<-1||p.z>1){d.classList.add('hidden');continue}d.classList.remove('hidden');d.style.left=`${(p.x*.5+.5)*innerWidth}px`;d.style.top=`${(-p.y*.5+.5)*innerHeight}px`;d.style.opacity=(Math.abs(p.x)>.96||Math.abs(p.y)>.96)?0:.88}}
function updateHud(){if(!player)return;$('hullFill').style.width=`${player.hp}%`;$('hullText').textContent=`${Math.ceil(player.hp)} / 100`;$('credits').textContent=`${player.credits} CR`;const t=validTarget();$('targetName').textContent=t?t.name:'NO THREAT';$('targetFill').style.width=t?`${Math.max(0,t.hp/t.maxHp*100)}%`:'0';$('targetHp').textContent=t?`${Math.max(0,Math.ceil(t.hp))} / ${t.maxHp}`:'--';$('targetState').textContent=t?'HOSTILE':worldAge<3?'SCANNING':'PASSIVE';$('disengage').hidden=!t;const s=entities.get(selectedId);$('selected').textContent=s?`${s.name} · ${s.category}`:'';$('interact').hidden=!(s?.category==='station'&&s.pos.distanceTo(player.pos)<55)}
function updateRadar(){const c=$('radar'),ctx=c.getContext('2d'),w=c.width,h=c.height,cx=w/2,cy=h/2;ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(53,205,232,.24)';ctx.lineWidth=2;for(const r of [46,92,137]){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.moveTo(cx,10);ctx.lineTo(cx,h-10);ctx.moveTo(10,cy);ctx.lineTo(w-10,cy);ctx.stroke();ctx.fillStyle='#50eaff';ctx.beginPath();ctx.moveTo(cx,cy-12);ctx.lineTo(cx-8,cy+8);ctx.lineTo(cx+8,cy+8);ctx.fill();for(const e of entities.values()){if(e===player||e.pendingDestroy)continue;const dx=(e.pos.x-player.pos.x)/42*137,dz=(e.pos.z-player.pos.z)/42*137;if(Math.hypot(dx,dz)>137)continue;ctx.fillStyle=e.category==='hostile'?'#ff665f':e.kind==='pickup'?'#61ebf5':e.category==='station'?'#ffc05a':'#92dca0';ctx.beginPath();ctx.arc(cx+dx,cy+dz,e.category==='hostile'?5:3,0,Math.PI*2);ctx.fill()}}
function invariants(){const errors=[],ids=[...entities.keys()],live=[...entities.values()].filter(e=>!e.pendingDestroy);if(new Set(ids).size!==ids.length)errors.push('duplicate entity ID');if(targetId&&!entities.has(targetId))errors.push('target references removed entity');if(selectedId&&!entities.has(selectedId))errors.push('selection references removed entity');if(targetId&&entities.get(targetId)?.pendingDestroy)errors.push('target is pending destroy');if(selectedId&&entities.get(selectedId)?.pendingDestroy)errors.push('selection is pending destroy');if([...representations.keys()].some(id=>!entities.has(id)))errors.push('removed render remnant');if(new Set([...representations.values()]).size!==representations.size)errors.push('duplicate representation');if(live.some(e=>e.pendingDestroy))errors.push('pending selectable entity');if(animationToken!==1||!loopStarted)errors.push('animation loop count differs from one');return{pass:errors.length===0,errors,loopCount:loopStarted?animationToken:0,entityCount:entities.size,representationCount:representations.size,targetId,selectedId}}
function snapshot(){return{backend:renderer.backend?.constructor?.name||'WebGPURenderer',seed,player:player?{id:player.id,pos:[player.pos.x,player.pos.y,player.pos.z],hp:player.hp,credits:player.credits,facing:player.facing,weaponFacing:player.weaponFacing}:null,targetId,selectedId,restartCount,events:[...events],stats:JSON.parse(JSON.stringify(stats)),entities:[...entities.values()].filter(e=>!e.pendingDestroy).map(e=>({id:e.id,name:e.name,kind:e.kind,category:e.category,pos:[e.pos.x,e.pos.y,e.pos.z],hp:e.hp,aggressive:e.aggressive})),invariants:invariants()}}
function selectAt(clientX,clientY){pointer.x=clientX/innerWidth*2-1;pointer.y=-(clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects([...representations.values()],true);for(const h of hits){let o=h.object;while(o&&!o.userData.entityId)o=o.parent;if(o?.userData.entityId){selectedId=o.userData.entityId;updateHud();return}}selectedId=null;updateHud()}
canvas.addEventListener('pointerup',e=>selectAt(e.clientX,e.clientY));$('disengage').addEventListener('click',()=>{targetId=null;disengageUntil=worldAge+1.6;addEvent('Tactical lock suppressed');updateHud()});$('interact').addEventListener('click',()=>{const s=entities.get(selectedId);if(s?.category==='station'){addEvent('Lattice traffic data received');updateHud()}});$('restart').addEventListener('click',restart);$('fullscreen').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():$('app').requestFullscreen());
function restart(){restartCount++;clearInput();for(const p of projectiles)p.mesh.removeFromParent();buildWorld();addEvent('Navigation core reconstructed')}
function setPlayerPosition(x,z){player.pos.set(x,0,z);player.model.position.copy(player.pos);updateCamera()}
function moveNear(name,distance=10){const e=[...entities.values()].find(x=>x.name===name);if(e){e.pos.set(player.pos.x+distance,0,player.pos.z);e.model.position.copy(e.pos)}}
function forceAggro(name){const e=[...entities.values()].find(x=>x.name===name);if(e){e.aggressive=true;e.cooldown=.3;targetId=e.id}}
function selectByName(name){const e=[...entities.values()].find(x=>x.name===name);selectedId=e?.id??null;updateHud()}
function spawnPickupNearPlayer(distance=6){const e=spawn({name:'Diagnostic salvage',kind:'pickup',category:'salvage',faction:'neutral',pos:[player.pos.x+distance,.2,player.pos.z],value:5,freeUntil:worldAge+.18},pickupModel());return e.id}
function frame(now){try{const dt=Math.min(.05,(now-lastTime)/1000||.016);lastTime=now;worldAge+=dt;if(!silhouette&&!firstFrame){updatePlayer(dt);updateCombat(dt);updateProjectiles(dt);updatePickups(dt)}for(const e of [...entities.values()])if(e.pendingDestroy&&e!==player)cleanupEntity(e);updateCamera();updateLabels();updateHud();updateRadar();renderer.render(scene,camera)}catch(error){fail('UPDATE/RENDER',error)}}
stage.textContent='Calibrating sector';updateCamera();renderer.setAnimationLoop(frame);loopStarted=true;$('loading').style.display='none';
window.__haio={ready:true,snapshot,invariants,clearInput,setPlayerPosition,moveNear,forceAggro,destroyHostile,disengage:()=>{targetId=null;disengageUntil=worldAge+1.6},restart,selectByName,spawnPickupNearPlayer};
}catch(error){fail('RENDERER/SCENE',error);throw error}
